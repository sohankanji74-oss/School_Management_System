
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student | School Management System</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="main-content">

    <header class="topbar">
        <div>
            <h2>Edit Student</h2>
            <p>Update student information</p>
        </div>

        <a href="{{ url_for('students') }}">Back to Students</a>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <section class="welcome-card">
        <h2>Update Student Details</h2>
        <p>Modify the information below.</p>
    </section>

    <section class="quick-access">

        <form method="POST"
              action="{{ url_for('edit_student', student_id=student.id) }}">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <div class="input-group">
                <label>Admission Number</label>
                <input type="text" name="admission_no"
                       value="{{ student.admission_no }}" required>
            </div>

            <div class="input-group">
                <label>Student Name</label>
                <input type="text" name="name"
                       value="{{ student.name }}" required>
            </div>

            <div class="input-group">
                <label>Gender</label>
                <select name="gender">
                    <option value="">Select Gender</option>
                    <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" name="dob"
                       value="{{ student.dob.strftime('%Y-%m-%d') if student.dob else '' }}">
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" name="phone"
                       value="{{ student.phone or '' }}">
            </div>

            <div class="input-group">
                <label>Address</label>
                <input type="text" name="address"
                       value="{{ student.address or '' }}">
            </div>

            <div class="input-group">
                <label>Class</label>
                <select name="class_id">
                    <option value="">Select Class</option>

                    {% for school_class in classes %}
                    <option value="{{ school_class.id }}"
                        {% if student.class_id == school_class.id %}selected{% endif %}>
                        {{ school_class.class_name }}
                        {{ school_class.section or '' }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="login-btn">
                Update Student
            </button>

        </form>

    </section>

</div>

</body>
</html>
