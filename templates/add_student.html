
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | School Management System</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="main-content">

    <header class="topbar">
        <div>
            <h2>Add New Student</h2>
            <p>Register a new student in the school</p>
        </div>

        <a href="{{ url_for('students') }}">Back to Students</a>
    </header>

    <section class="welcome-card">
        <h2>Student Registration Form</h2>
        <p>Enter the student's details below.</p>
    </section>

    <section class="quick-access">

        <form method="POST" action="{{ url_for('add_student') }}">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <div class="input-group">
                <label>Admission Number</label>
                <input type="text" name="admission_no"
                       placeholder="Enter admission number" required>
            </div>

            <div class="input-group">
                <label>Student Name</label>
                <input type="text" name="name"
                       placeholder="Enter full name" required>
            </div>

            <div class="input-group">
                <label>Gender</label>
                <select name="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" name="dob">
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" name="phone"
                       placeholder="Enter phone number">
            </div>

            <div class="input-group">
                <label>Address</label>
                <input type="text" name="address"
                       placeholder="Enter address">
            </div>

            <div class="input-group">
                <label>Class</label>
                <select name="class_id">
                    <option value="">Select Class</option>
                    {% for school_class in classes %}
                    <option value="{{ school_class.id }}">
                        {{ school_class.class_name }}
                        {{ school_class.section or '' }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="login-btn">
                Register Student
            </button>

        </form>

    </section>

</div>

</body>
</html>
